name: Deploy Siza Server to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Siza Server
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/siza-server-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/apps/siza-server/"
          strip_components: 1

      - name: Restart Siza Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/siza-server

            echo "Stopping existing Siza Server..."
            pkill -f 'siza-server-0.0.1-SNAPSHOT.jar' || true

            sleep 2

            echo "Starting Siza Server..."
            nohup java -jar siza-server-0.0.1-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              > siza-server.log 2>&1 &

            sleep 5

            echo "Checking application..."
            pgrep -af 'siza-server-0.0.1-SNAPSHOT.jar'
