databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: siza
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: first_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: last_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: phone_number, type: VARCHAR(30), constraints: { nullable: false, unique: true } }
              - column: { name: role, type: VARCHAR(30), defaultValue: CUSTOMER, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP }
